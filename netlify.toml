[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# API redirects (must come before SPA redirect)
[[redirects]]
  from = "/api/reconstruct-3d"
  to = "/.netlify/functions/reconstruct-3d"
  status = 200

[[redirects]]
  from = "/api/generate-info-card"
  to = "/.netlify/functions/generate-info-card"
  status = 200

# SPA redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for PWA
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
